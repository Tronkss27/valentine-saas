<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="hearts-bg" id="hearts-bg"></div>

    <!-- MAIN CARD (Initial State) -->
    <div class="container card-container" id="main-card">
        <img src="pig-0.png" alt="Cute Pig with Flowers" class="mascot-large">
        
        <h1 id="question">Hey <span id="name-placeholder">...</span>,<br>will you be my Valentine?</h1>
        <p class="subtitle" id="subtitle">Choose carefully... (you don't have much choice 😜)</p>

        <div class="buttons-area">
            <button id="yes-btn" class="btn-action yes">Yes</button>
            <button id="no-btn" class="btn-action no">No</button>
        </div>

        <p id="response-msg" class="response-text"></p>
    </div>

    <!-- VICTORY SCREEN (Hidden by default) -->
    <div id="victory-screen" class="victory-container hidden">
        <div class="victory-content">
            <img src="pig-success.png" alt="Pigs Hugging" class="victory-mascot">
            <h1 id="victory-title">YAAAAY! 🎉</h1>
            <p id="victory-message">I knew you would say YES!<br>Love you! 💖</p>
            <div class="date-invite">
                <p>It's a date! 📅</p>
            </div>
        </div>
    </div>

    <script src="translations.js?v=2"></script>
    <script src="card.js?v=2"></script>
</body>
</html>
